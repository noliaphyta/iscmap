<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <!-- Same anti-flash inline script as index.html, same storage key
       ("campus-map-theme" - intentionally shared across both pages so a
       theme choice made on one map carries over to the other instead of
       each page tracking its own). See index.html for the full rationale. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("campus-map-theme");
        var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <title>Swem Library Map</title>

  <link rel="icon" type="image/png" href="assets/icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <header class="site-header">
      <h1>SWEM LIBRARY MAP</h1>
      <a class="building-switch-link" href="index.html">ISC MAP &rarr;</a>
    </header>

    <div id="controls"></div>
    <div id="info-panel"><p class="info-empty">Search for a room, or hover the floor plan to see a category here.</p></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="src/libraryMain.js"></script>
</body>
</html>
